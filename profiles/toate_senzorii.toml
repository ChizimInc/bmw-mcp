nume = "cadere_la_cuplare"
tip = "cadere"
camp = "rpm"
cu = 150
in_s = 1.5
conditii = ["pedala < 2", "viteza < 15"]
[[steag]]
nume = "tmot_prag"
tip = "trece_prag"
camp = "tmot"
